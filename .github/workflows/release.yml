name: Release

# Every push to main is a release. The commit is tagged with the next version,
# published to Maven Central through the Sonatype Central Portal, and given a
# GitHub Release whose notes are generated from the commits since the last one.
#
# The bump is a patch unless the commit message says otherwise: a message
# containing "#minor" bumps the minor version, "#major" the major. With no tag
# in the repository yet, the first release is v1.0.0.
#
# The four secrets carry the same names as in frikit/krandom, so the same values
# serve both repositories.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession must not both compute "next version" from the
# same last tag, so releases queue rather than run side by side.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag and create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # dynver and the bump need every tag

      # Two reasons not to release: the repository is not set up for it, or the
      # commit says it changes nothing a user could depend on. A version on Maven
      # Central can never be taken back or altered, so a workflow or documentation
      # change should not have to spend one.
      #
      # All four secrets are required, not some: a half-configured repository
      # would otherwise fail deep inside sbt with a message about something else.
      - name: Decide whether to release
        id: guard
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] &&
             git log -1 --pretty=%B | grep -qiF '[skip release]'; then
            echo "::notice::The commit asks for no release; verified only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ] ||
               [ -z "$GPG_SIGNING_KEY" ] || [ -z "$GPG_SIGNING_PASSWORD" ]; then
            echo "::notice::Publishing secrets are not configured; verified but not released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # sbt-ci-release wants the signing key base64-encoded; Gradle's
      # useInMemoryPgpKeys (as in krandom) wants it raw. Accept either, so the
      # same secret value can be pasted into both repositories.
      - name: Put the signing key in the form sbt-ci-release expects
        if: steps.guard.outputs.release == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if printf '%s' "$GPG_SIGNING_KEY" | grep -q 'BEGIN PGP'; then
            encoded="$(printf '%s' "$GPG_SIGNING_KEY" | base64 -w0)"
            echo "signing key was armoured text; encoded it"
          else
            encoded="$(printf '%s' "$GPG_SIGNING_KEY" | tr -d ' \n')"
            echo "signing key was already base64"
          fi
          echo "::add-mask::$encoded"
          echo "PGP_SECRET=$encoded" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        if: steps.guard.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1
        if: steps.guard.outputs.release == 'true'

      # The tag is made here but pushed only after publishing has succeeded, so a
      # failed publish leaves nothing behind and the next attempt computes the same
      # version again.
      - name: Work out the next version and tag it
        if: steps.guard.outputs.release == 'true'
        id: version
        run: |
          set -euo pipefail
          last="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$last" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            message="$(git log -1 --pretty=%B)"
            if   grep -qi '#major' <<< "$message"; then next="v$((major + 1)).0.0"
            elif grep -qi '#minor' <<< "$message"; then next="v$major.$((minor + 1)).0"
            else                                          next="v$major.$minor.$((patch + 1))"
            fi
          fi
          echo "previous: ${last:-none}   next: $next"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      # sbt-ci-release publishes a stable release only when GITHUB_REF names a tag.
      # The runner sets it to the branch, because the tag above was made in this
      # job rather than pushed, so the sbt process is handed the tag instead. The
      # plugin exits 0 when it decides there is nothing to publish; that is an
      # error here, not a green run.
      - name: Publish to Maven Central
        if: steps.guard.outputs.release == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSWORD }}
          # PGP_SECRET comes from the step above, via GITHUB_ENV
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          GITHUB_REF="refs/tags/$RELEASE_TAG" sbt ci-release | tee ci-release.log
          if grep -q 'doing nothing' ci-release.log; then
            echo "::error::sbt ci-release decided not to publish; its reason is in the output above"
            exit 1
          fi

      - name: Push the tag and create the GitHub Release
        if: steps.guard.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # --no-verify: the pre-push hook would otherwise run the whole suite
          # again here, after publishing, when the checks have already passed.
          git push --no-verify origin "$RELEASE_TAG"
          # The artifacts are on Central by now, so a passing hiccup in GitHub's
          # API must not leave the version without its release page. v2.0.0 met
          # an HTTP 500 at exactly this point.
          for attempt in 1 2 3; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
               gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes; then
              exit 0
            fi
            echo "creating the release failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1
