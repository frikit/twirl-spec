name: Release

# Every push to main is a release, unless every commit since the last release
# asks for none. The commit is tagged with the next version, published to Maven
# Central through the Sonatype Central Portal, and given a GitHub Release whose
# notes are the version's section of CHANGELOG.md.
#
# What to release is read from every commit since the last release, by
# .github/scripts/release-plan.sh, from each commit's subject line: the bump is
# a patch unless a subject says #minor or #major, the highest winning, and the
# push releases nothing when every subject says [skip release]. With no tag in
# the repository yet, the first release is v1.0.0.
#
# The four secrets carry the same names as in frikit/krandom, so the same values
# serve both repositories.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession must not both compute "next version" from the
# same last tag, so releases queue rather than run side by side.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    # A manual run on another branch must not tag and publish unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag and create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the plan and dynver need every tag

      - name: Plan the release
        id: plan
        run: .github/scripts/release-plan.sh | tee -a "$GITHUB_OUTPUT"

      # Reasons not to publish: this commit is already a release (a re-run, or
      # a manual run on a released commit), every commit asks for no release,
      # or the repository is not set up to publish. A version on Maven Central
      # can never be taken back or altered, so none of these may spend one.
      #
      # All four secrets are required, not some: a half-configured repository
      # would otherwise fail deep inside sbt with a message about something
      # else. Their absence fails the run here, where a green run that
      # published nothing would pass unnoticed, and is only a notice in a fork.
      - name: Decide whether to release
        id: guard
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          SKIP: ${{ steps.plan.outputs.skip }}
        run: |
          set -euo pipefail
          tagged="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          if [ -n "$tagged" ]; then
            echo "::notice::This commit is already released as $tagged; its GitHub Release is made sure of, and nothing is published."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$SKIP" = "true" ]; then
            echo "::notice::Every commit since the last release says [skip release]; verified only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ] ||
               [ -z "$GPG_SIGNING_KEY" ] || [ -z "$GPG_SIGNING_PASSWORD" ]; then
            if [ "$GITHUB_REPOSITORY" = "frikit/twirl-spec" ]; then
              echo "::error::The publishing secrets are missing, so this release cannot be published."
              exit 1
            fi
            echo "::notice::Publishing secrets are not configured; verified but not released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # The GitHub Release's notes are the changelog's section for the version,
      # and a forgotten #minor or #major would publish the wrong number for
      # good, so the newest section has to name the version being released.
      - name: Check the changelog names this version
        if: steps.guard.outputs.release == 'true'
        env:
          NEXT: ${{ steps.plan.outputs.next }}
        run: |
          set -euo pipefail
          newest="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md || true)"
          if [ "$newest" != "## [${NEXT#v}]" ]; then
            echo "::error::This release is ${NEXT#v}, but the changelog's newest section is '${newest:-none}'. Add a '## [${NEXT#v}] - date' section, or mark the commits #minor or #major."
            exit 1
          fi

      # sbt-ci-release wants the signing key base64-encoded; Gradle's
      # useInMemoryPgpKeys (as in krandom) wants it raw. Accept either, so the
      # same secret value can be pasted into both repositories.
      - name: Put the signing key in the form sbt-ci-release expects
        if: steps.guard.outputs.release == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if printf '%s' "$GPG_SIGNING_KEY" | grep -q 'BEGIN PGP'; then
            encoded="$(printf '%s' "$GPG_SIGNING_KEY" | base64 -w0)"
            echo "signing key was armoured text; encoded it"
          else
            encoded="$(printf '%s' "$GPG_SIGNING_KEY" | tr -d ' \n')"
            echo "signing key was already base64"
          fi
          echo "::add-mask::$encoded"
          echo "PGP_SECRET=$encoded" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.guard.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
        if: steps.guard.outputs.release == 'true'

      # The tag is made here but pushed only after publishing has succeeded, so a
      # failed publish leaves nothing behind and the next attempt computes the same
      # version again.
      - name: Tag the version
        if: steps.guard.outputs.release == 'true'
        env:
          NEXT: ${{ steps.plan.outputs.next }}
          LAST: ${{ steps.plan.outputs.last }}
        run: |
          set -euo pipefail
          echo "previous: ${LAST:-none}   next: $NEXT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"

      # A re-run after publishing succeeded but the tag push did not finds the
      # version on Central already, and goes straight on to the tag and the
      # release. Central refuses a version it already holds, so a re-run that
      # races Central's own sync fails rather than publishing twice; run it
      # again once the version shows on repo1.
      #
      # sbt-ci-release publishes a stable release only when GITHUB_REF names a
      # tag. The runner sets it to the branch, because the tag above was made in
      # this job rather than pushed, so the sbt process is handed the tag
      # instead. The plugin exits 0 when it decides there is nothing to publish;
      # that is an error here, not a green run.
      - name: Publish to Maven Central
        if: steps.guard.outputs.release == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSWORD }}
          # PGP_SECRET comes from the step above, via GITHUB_ENV
          RELEASE_TAG: ${{ steps.plan.outputs.next }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          pom="https://repo1.maven.org/maven2/io/github/frikit/twirl-spec-core_3/$version/twirl-spec-core_3-$version.pom"
          if curl -sfI "$pom" > /dev/null; then
            echo "::notice::$version is already on Maven Central; it is tagged and released without publishing again."
            exit 0
          fi
          GITHUB_REF="refs/tags/$RELEASE_TAG" sbt ci-release | tee ci-release.log
          if grep -q 'doing nothing' ci-release.log; then
            echo "::error::sbt ci-release decided not to publish; its reason is in the output above"
            exit 1
          fi

      - name: Push the tag
        if: steps.guard.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.next }}
        # --no-verify: the pre-push hook would otherwise run the whole suite
        # again here, after publishing, when the checks have already passed.
        run: git push --no-verify origin "$RELEASE_TAG"

      - name: Make sure the GitHub Release exists
        if: steps.guard.outputs.release == 'true' || steps.guard.outputs.tagged != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.guard.outputs.tagged || steps.plan.outputs.next }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$RELEASE_TAG^" 2>/dev/null || true)"

          # The notes are the changelog's section for this version when it has
          # one. GitHub's generated notes list pull requests, and a push straight
          # to main has none, so they would be a bare compare link.
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { if (on) exit }
            on && (started || !/^$/) { started = 1; print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "${previous:-$RELEASE_TAG}" "$RELEASE_TAG" >> release-notes.md
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi

          # The artifacts are on Central by now, so a passing hiccup in GitHub's
          # API must not leave the version without its release page: v2.0.0 met
          # an HTTP 500 at exactly this point, and that attempt left a draft.
          for attempt in 1 2 3; do
            state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
            case "$state" in
              false) exit 0 ;;
              true)  gh release delete "$RELEASE_TAG" --yes || true ;;
            esac
            if gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" "${notes[@]}"; then
              exit 0
            fi
            echo "creating the release failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1
