name: CI

# The checks every change has to pass. Pull requests run this directly; pushes
# to main run it through release.yml, which publishes only if it is green.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is derived from git tags

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Check formatting and licence headers
        run: sbt scalafmtCheckAll scalafmtSbtCheck headerCheckAll

      - name: Test, against the coverage gate
        run: sbt coverage test coverageOff coverageReport

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoverage-reports
          path: '*/target/scala-*/scoverage-report'
          if-no-files-found: warn
