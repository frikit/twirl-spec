name: CI

# The checks every change has to pass. Pull requests run this directly; pushes
# to main run it through release.yml, which publishes only if it is green.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version, and the release to compare with, come from the tags

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Check formatting and licence headers
        run: sbt scalafmtCheckAll scalafmtSbtCheck headerCheckAll

      - name: Check the release plan
        run: .github/scripts/test-release-plan.sh

      # The public API is stable within a major version, so every module has to
      # stay binary compatible with the last release, unless the release this
      # change would make is a major: the same plan release.yml publishes by.
      - name: Check binary compatibility with the last release
        run: |
          bump="$(.github/scripts/release-plan.sh | sed -n 's/^bump=//p')"
          if [ "$bump" = "major" ]; then
            echo "::notice::The commits since the last release make a major, so the API may change."
          else
            sbt mimaReportBinaryIssues
          fi

      - name: Test, against the coverage gate
        run: sbt coverage test coverageOff coverageReport

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scoverage-reports
          path: '*/target/scala-*/scoverage-report'
          if-no-files-found: warn

  # The library as a service gets it: the POMs a release would publish, and a
  # Play application's view specs built against the artifacts, on the Scala,
  # -release and Play of a service today and of the newest.
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scala: 3.3.7, release: '11', play: 3.0.10 }
          - { scala: 3.9.0, release: '21', play: 3.0.11 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Publish the library locally
        run: sbt 'set ThisBuild / version := "0.0.0-CONSUMER"' publishLocal makePom

      - name: Check the POMs against the dependency decisions
        run: python3 .github/scripts/check-poms.py 0.0.0-CONSUMER

      - name: Run a service's view specs against it
        working-directory: consumer
        run: >-
          sbt -Dconsumer.scala=${{ matrix.scala }}
          -Dconsumer.release=${{ matrix.release }}
          -Dconsumer.play=${{ matrix.play }}
          test
