name: Scala Steward

# Opens a pull request for each library and plugin update, once a week or on
# demand. Dependabot does not understand sbt; Scala Steward does.
#
# With the workflow's own token, GitHub does not start CI on the pull requests
# the workflow opens. A fine-grained personal access token with contents and
# pull-requests write access, stored as SCALA_STEWARD_TOKEN, lifts that; until
# one exists the workflow falls back to its own token.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN || secrets.GITHUB_TOKEN }}
