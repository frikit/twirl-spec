# Builds the documentation site and publishes it to GitHub Pages: the README
# and the `docs` folder through Jekyll, and the Scaladoc of every module,
# rendered as one site by `sbt unidoc`, under /api.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment must not overtake the one before it, and a release push that
# lands while one is running should wait rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The Scaladoc header carries the version, which sbt-dynver reads
          # from the tags.
          fetch-depth: 0

      - uses: actions/configure-pages@v6

      - name: Build the pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Build the API documentation
        run: sbt -batch --no-colors unidoc

      - name: Put the API documentation under /api
        run: |
          set -euo pipefail
          mkdir -p _site/api
          cp -R target/scala-*/unidoc/. _site/api/
          test -f _site/api/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
