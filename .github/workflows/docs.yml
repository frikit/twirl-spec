# Builds the documentation site and publishes it to GitHub Pages: the README
# and the `docs` folder through Jekyll, and the Scaladoc of every module,
# rendered as one site by `sbt unidoc`, under /api.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment must not overtake the one before it, and a release push that
# lands while one is running should wait rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Scaladoc header carries the version, which sbt-dynver reads
          # from the tags.
          fetch-depth: 0

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Build the API documentation
        run: sbt -batch --no-colors unidoc

      - name: Put the API documentation under /api
        run: |
          set -euo pipefail
          # jekyll-build-pages runs in a container as root, so the site it
          # wrote is not ours to add to until we take it back.
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/api
          cp -R target/scala-*/unidoc/. _site/api/
          test -f _site/api/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
