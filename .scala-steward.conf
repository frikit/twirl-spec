# What Scala Steward may and may not propose. build.sbt's dependencyUpdatesFilter
# says the same for `sbt dependencyUpdates`, but Steward reads only this file.

updates.pin = [
  # Scala 3.3 is the LTS line every later Scala 3 can read. A newer minor would
  # publish TASTy that no consumer on 3.3 to 3.8 can read.
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  # sbt 2 waits for a stable sbt-twirl built for it.
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]

updates.ignore = [
  # Built against the oldest Play 3.0.x on purpose, and Provided, so a service
  # keeps its own Play.
  { groupId = "org.playframework", artifactId = "play" },
  { groupId = "org.playframework", artifactId = "play-test" },
  { groupId = "org.playframework", artifactId = "play-guice" },
  { groupId = "org.playframework", artifactId = "play-filters-helpers" },
  # twirl-api stays at 2.0.1, the one Play 3.0.0 ships, so the POM asks a
  # service for nothing newer than its own Play brings.
  { groupId = "org.playframework.twirl", artifactId = "twirl-api" }
]

# The consumer build follows current Play and Scala, which is its point.
buildRoots = [ ".", "consumer" ]

# An update ships with the next change that needs a release, not on its own.
commits.message = "${default} [skip release]"
